name: Cache Workflow
on: workflow_dispatch
jobs:
    cache-command:
        runs-on: ubuntu-latest
        steps:
            # copy repository to the runner
            - uses: actions/checkout@v6
            - name: Cache node modules
              id: cache-step
              uses: actions/cache@v5
              # specify the path to cache it's for linux runner
              with:
                  path: ~/.npm
                  key: ${{runner.os}}-cache-file-${{ hashFiles('**/package-lock.json') }}
                  # specify restore keys to restore cache if there is no exact match
                  restore-keys: |
                      ${{runner.os}}-cache-file-
                      ${{runner.os}}-
            - name: Display cache content
              # display cache content
              run: echo '${{ toJson(steps.cache-step.outputs)}}'
            - name: Install dependencies
              run: npm install
