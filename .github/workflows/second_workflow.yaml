name: Second Workflow
on: push
jobs:
    run-first-command:
        runs-on: ubuntu-latest
        steps:
            - name: first command
              run: echo "Hello, World!"
            - name: multi-line script
              run: |-
                  node -v
                  npm -v
    run-paralel-command:
        runs-on: windows-latest
        steps:
            - name: node version windows
              run: node -v
    run-second-command:
        runs-on: macos-latest
        needs: run-first-command
        steps:
            - name: display npm version macos
              run: npm -v
