name: Artifact Workflow
on: push
jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: Math expression
              #create a file with the result of the expression
              run: expr 2 + 2 > result.txt
            - name: Upload result file
              uses: actions/upload-artifact@v7
              with:
                  name: result-file
                  path: result.txt
    second-job:
        runs-on: ubuntu-latest
        needs: first-job
        steps:
            - name: Download result file
              uses: actions/download-artifact@v8
              with:
                  name: result-file
            - name: Show result
              run: |
                  echo "The result of the expression is: $(cat result.txt)"
